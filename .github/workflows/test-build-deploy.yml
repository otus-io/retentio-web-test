---
# Test, build, and deploy to production over SSH: pull main, install, build, run via systemd.
#
# Production app directory: ~/otusio/retentio-web-test
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SERVER_HOST       — hostname or IP
#   SERVER_USERNAME   — SSH user (e.g. otus)
#   SERVER_SSH_KEY    — private key for that user; matching public key in ~/.ssh/authorized_keys on the server
#   E2E_USERNAME      — dedicated test account for Playwright
#   E2E_PASSWORD      — password for that account
#
# Server prerequisites:
#   — Git, Node.js 20+ on PATH (nvm or system install)
#   — npm 10+
#   — Passwordless sudo for cp of utils/retentio-web-test.service → /etc/systemd/system/,
#     plus systemctl daemon-reload, enable, restart (see retentio-backend/docs/server-side-config.md)
#   — Repo cloned at ~/otusio/retentio-web-test with origin able to fetch this repository

name: Test and Deploy Web Test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.env.example'
      - 'utils/run-web-test-prod.sh'
      - 'utils/retentio-web-test.service'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/test-build-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.env.example'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/test-build-deploy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://api.retentio.app:8443

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_API_URL: https://api.retentio.app:8443
          VITE_API_URL: https://api.retentio.app:8443

  deploy-web-test:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/otusio/retentio-web-test
            source ~/.profile 2>/dev/null || true
            source ~/.bashrc 2>/dev/null || true
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            set +u
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm use 20 2>/dev/null || nvm use default 2>/dev/null || true
            fi
            set -u
            export PATH="$HOME/.npm-global/bin:/usr/local/bin:$PATH"
            REQUIRED_NODE_VERSION="20.0.0"
            NODE_VERSION="$(node -v 2>/dev/null | sed 's/^v//' || echo 0)"
            if [ "$(printf '%s\n' "$REQUIRED_NODE_VERSION" "$NODE_VERSION" | sort -V | head -n1)" != "$REQUIRED_NODE_VERSION" ]; then
              echo "node $NODE_VERSION found; require >=$REQUIRED_NODE_VERSION"
              exit 1
            fi
            node -v
            npm ci --include=dev
            VITE_API_URL=https://api.retentio.app:8443 npm run build
            sudo cp ~/otusio/retentio-web-test/utils/retentio-web-test.service /etc/systemd/system/retentio-web-test.service
            sudo systemctl daemon-reload
            sudo systemctl enable retentio-web-test
            sudo systemctl restart retentio-web-test || exit 1
